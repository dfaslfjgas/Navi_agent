[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navi-agent"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
   "jsonschema>=4.0",
   "langchain-core>=1.6.9,<2.0",
   "langchain-openai>=1.7.0,<2.0"
]

[project.urls]


[tool.hatch.version]
path = "src/navi_agent/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/navi_agent tests}"

[tool.coverage.run]
source_pkgs = ["navi_agent", "tests"]
branch = true
parallel = true
omit = [
  "src/navi_agent/__about__.py",
]

[tool.coverage.paths]
navi_agent = ["src/navi_agent", "*/navi-agent/src/navi_agent"]
tests = ["tests", "*/navi-agent/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
